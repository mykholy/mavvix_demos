name: Prepare licensed TradeBridge photography
on:
  workflow_dispatch:
  push:
    branches: [feat/vertical-wholesale]
    paths:
      - '.github/workflows/prepare-tradebridge-media.yml'
      - 'scripts/prepare-tradebridge-media.mjs'
permissions:
  contents: read
concurrency:
  group: tradebridge-local-media
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/vertical-wholesale'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/prepare-tradebridge-media.mjs
      - name: Prepare restricted binary patch
        run: |
          git add -- public/assets/portfolio/tradebridge-warehouse.webp public/assets/portfolio/tradebridge-stock.webp data/verticals/wholesale.json docs/30-verticals/media/wholesale.media-manifest.json
          git diff --cached --binary > /tmp/tradebridge-media.patch
          test -s /tmp/tradebridge-media.patch
      - uses: actions/upload-artifact@v4
        with:
          name: tradebridge-local-media
          path: |
            /tmp/tradebridge-media.patch
            public/assets/portfolio/tradebridge-*.webp
            docs/30-verticals/media/wholesale.media-manifest.json
  publish:
    needs: prepare
    if: github.ref == 'refs/heads/feat/vertical-wholesale'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vertical-wholesale
      - uses: actions/download-artifact@v4
        with:
          name: tradebridge-local-media
          path: /tmp/approved-media
      - name: Commit only verified media to wholesale branch
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          patch="$(find /tmp/approved-media -name tradebridge-media.patch -type f)"
          test -f "$patch"
          git apply --index "$patch"
          git diff --cached --name-only | while IFS= read -r file; do
            case "$file" in
              public/assets/portfolio/tradebridge-warehouse.webp|public/assets/portfolio/tradebridge-stock.webp|data/verticals/wholesale.json|docs/30-verticals/media/wholesale.media-manifest.json) ;;
              *) echo "Unexpected path $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(media): self-host verified TradeBridge wholesale photography'
          git push origin HEAD:refs/heads/feat/vertical-wholesale
