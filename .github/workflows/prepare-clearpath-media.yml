name: Prepare licensed ClearPath photography
on:
  workflow_dispatch:
  push:
    branches: [feat/vertical-diagnostics-lab]
    paths:
      - '.github/workflows/prepare-clearpath-media.yml'
      - 'scripts/prepare-clearpath-media.mjs'
permissions:
  contents: read
concurrency:
  group: clearpath-local-media
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/vertical-diagnostics-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Download and decode exact licensed originals
        run: node scripts/prepare-clearpath-media.mjs
      - name: Prepare restricted binary patch
        run: |
          git add -- public/assets/portfolio/clearpath-glassware.webp public/assets/portfolio/clearpath-analyzer.webp data/verticals/diagnostics-lab.json docs/30-verticals/media/diagnostics-lab.media-manifest.json
          git diff --cached --binary > /tmp/clearpath-media.patch
          test -s /tmp/clearpath-media.patch
      - uses: actions/upload-artifact@v4
        with:
          name: clearpath-local-media
          path: |
            /tmp/clearpath-media.patch
            public/assets/portfolio/clearpath-*.webp
            docs/30-verticals/media/diagnostics-lab.media-manifest.json
  publish:
    needs: prepare
    if: github.ref == 'refs/heads/feat/vertical-diagnostics-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vertical-diagnostics-lab
      - uses: actions/download-artifact@v4
        with:
          name: clearpath-local-media
          path: /tmp/approved-media
      - name: Commit only verified local media to sector branch
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          patch="$(find /tmp/approved-media -name clearpath-media.patch -type f)"
          test -f "$patch"
          git apply --index "$patch"
          git diff --cached --name-only | while IFS= read -r file; do
            case "$file" in
              public/assets/portfolio/clearpath-glassware.webp|public/assets/portfolio/clearpath-analyzer.webp|data/verticals/diagnostics-lab.json|docs/30-verticals/media/diagnostics-lab.media-manifest.json) ;;
              *) echo "Unexpected path $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(media): self-host verified ClearPath laboratory photography'
          git push origin HEAD:refs/heads/feat/vertical-diagnostics-lab
