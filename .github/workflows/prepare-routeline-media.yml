name: Prepare licensed RouteLine photograph
on:
  workflow_dispatch:
  push:
    branches: [feat/vertical-logistics]
    paths: ['.github/workflows/prepare-routeline-media.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/vertical-logistics'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Download verified CC0 original and validate bytes
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --retry-all-errors --max-time 90 --max-filesize 10000000 --user-agent 'MavvixPortfolio/1.0 (info@mavvix.com; licensed photo mirror)' 'https://upload.wikimedia.org/wikipedia/commons/7/73/Shipping_terminal_in_Singapore_%28Unsplash%29.jpg' -o /tmp/routeline-original.jpg
          echo '778d2efe0fb0104d8ee41978e0bb25e24b6b2ca3  /tmp/routeline-original.jpg' | sha1sum -c -
          mkdir -p public/assets/portfolio
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import crypto from 'node:crypto';
          import sharp from 'sharp';
          const original='/tmp/routeline-original.jpg';
          const meta=await sharp(original,{limitInputPixels:50000000}).metadata();
          if(meta.format!=='jpeg'||meta.width!==3991||meta.height!==2661)throw Error('Unexpected original image');
          const file='public/assets/portfolio/routeline-singapore-terminal.webp';
          await sharp(original).rotate().resize({width:1600,height:1600,fit:'inside'}).webp({quality:85}).toFile(file);
          const bytes=await fs.readFile(file);
          const m=await sharp(bytes).metadata(); await sharp(bytes).raw().toBuffer();
          const data=JSON.parse(await fs.readFile('data/verticals/logistics.json','utf8'));
          const photo=data.media[0];
          const originalUrl='https://upload.wikimedia.org/wikipedia/commons/7/73/Shipping_terminal_in_Singapore_%28Unsplash%29.jpg';
          const local='/assets/portfolio/routeline-singapore-terminal.webp';
          const evidence={id:'routeline-singapore-terminal',source_page:photo.source,author:photo.credit,license:photo.license,license_url:photo.licenseUrl,downloaded_from:originalUrl,original_sha1:'778d2efe0fb0104d8ee41978e0bb25e24b6b2ca3',local,dimensions:m.width+'x'+m.height,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),bytes:bytes.length,changes:'Resized and WebP encoded; display crop; independent editorial photograph, not a RouteLine facility'};
          photo.url=local; await fs.writeFile('data/verticals/logistics.json',JSON.stringify(data,null,2)+'\n');
          await fs.writeFile('docs/30-verticals/media/logistics.media-manifest.json',JSON.stringify({vertical:'logistics',assets:[evidence]},null,2)+'\n');
          console.log('VERIFIED MEDIA',JSON.stringify(evidence));
          NODE
          git add -- public/assets/portfolio/routeline-singapore-terminal.webp data/verticals/logistics.json docs/30-verticals/media/logistics.media-manifest.json
          git diff --cached --binary > /tmp/routeline-media.patch
          test -s /tmp/routeline-media.patch
      - uses: actions/upload-artifact@v4
        with:
          name: routeline-media
          path: |
            /tmp/routeline-media.patch
            public/assets/portfolio/routeline-singapore-terminal.webp
            docs/30-verticals/media/logistics.media-manifest.json
  publish:
    needs: prepare
    if: github.ref == 'refs/heads/feat/vertical-logistics'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vertical-logistics
      - uses: actions/download-artifact@v4
        with:
          name: routeline-media
          path: /tmp/routeline-approved
      - name: Publish only licensed media on exact feature head
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          patch="$(find /tmp/routeline-approved -name routeline-media.patch -type f)"
          test -f "$patch"
          git apply --index "$patch"
          git diff --cached --name-only | while IFS= read -r file; do
            case "$file" in
              public/assets/portfolio/routeline-singapore-terminal.webp|data/verticals/logistics.json|docs/30-verticals/media/logistics.media-manifest.json) ;;
              *) echo "Unexpected path $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(logistics): self-host checksum-verified CC0 terminal photograph'
          git push origin HEAD:refs/heads/feat/vertical-logistics
