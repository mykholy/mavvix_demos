name: Mavvix Real Browser & Visual QA
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'data/**'
      - '05_ENGINEERING/**'
      - 'tests/**'
      - 'package*.json'
      - 'public/**'
      - 'next.config.*'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - 'tsconfig.json'
      - 'docs/30-verticals/**'
      - '.github/workflows/visual-quality.yml'
  workflow_dispatch:
    inputs:
      sectors:
        description: 'Comma-separated sector slugs, or all for full regression'
        required: false
        default: 'all'
        type: string
concurrency:
  group: visual-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  chromium-visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      SQLITE_DB_PATH: ./data/mavvix-demo.sqlite
      ADMIN_BOOTSTRAP_EMAIL: qa-operator@mavvix.invalid
      ADMIN_BOOTSTRAP_PASSWORD: ci-test-only-password-2026-strong
      NEXT_TELEMETRY_DISABLED: '1'
      MAVVIX_VISUAL_QA_PACKAGES: /tmp/mavvix-visual-qa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Detect affected visual QA sectors
        id: scope
        env:
          MAVVIX_REQUESTED_SCOPE: ${{ inputs.sectors || 'all' }}
        run: node scripts/visual-scope.mjs
      - name: Locked install
        run: npm ci
      - name: Fresh isolated database schema + authored data
        run: |
          npm run db:migrate
          npm run db:seed
      - name: Production build
        run: npm run build
      - name: Install pinned Playwright API and axe audit (browser preinstalled in official container)
        run: npm install --prefix /tmp/mavvix-visual-qa --no-save --no-package-lock playwright@1.58.2 axe-core@4.10.3
      - name: Inspect actual mobile, tablet and desktop AR/EN browser layouts and record screenshots
        env:
          MAVVIX_VISUAL_SECTORS: ${{ steps.scope.outputs.sectors }}
        run: node scripts/visual-qa.mjs
      - name: Upload image artifacts, issue ledger and accessibility results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mavvix-visual-qa-${{ github.run_id }}
          path: artifacts/visual-qa
          retention-days: 30
          if-no-files-found: warn
