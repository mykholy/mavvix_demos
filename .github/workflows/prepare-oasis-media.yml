name: Prepare additional licensed Oasis photography
on:
  workflow_dispatch:
  push:
    branches: [feat/vertical-boutique-hotel]
    paths:
      - '.github/workflows/prepare-oasis-media.yml'
      - 'scripts/prepare-oasis-media.mjs'
permissions:
  contents: read
concurrency:
  group: oasis-local-media
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/vertical-boutique-hotel'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/prepare-oasis-media.mjs
      - name: Prepare restricted binary patch
        run: |
          git add -- public/assets/portfolio/oasis-dining.webp public/assets/portfolio/oasis-courtyard.webp data/verticals/boutique-hotel.json docs/30-verticals/media/boutique-hotel.media-manifest.json
          git diff --cached --binary > /tmp/oasis-media.patch
          test -s /tmp/oasis-media.patch
      - uses: actions/upload-artifact@v4
        with:
          name: oasis-local-media
          path: |
            /tmp/oasis-media.patch
            public/assets/portfolio/oasis-dining.webp
            public/assets/portfolio/oasis-courtyard.webp
            docs/30-verticals/media/boutique-hotel.media-manifest.json
  publish:
    needs: prepare
    if: github.ref == 'refs/heads/feat/vertical-boutique-hotel'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vertical-boutique-hotel
      - uses: actions/download-artifact@v4
        with:
          name: oasis-local-media
          path: /tmp/approved-media
      - name: Commit only verified media to hotel branch
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          patch="$(find /tmp/approved-media -name oasis-media.patch -type f)"
          test -f "$patch"
          git apply --index "$patch"
          git diff --cached --name-only | while IFS= read -r file; do
            case "$file" in
              public/assets/portfolio/oasis-dining.webp|public/assets/portfolio/oasis-courtyard.webp|data/verticals/boutique-hotel.json|docs/30-verticals/media/boutique-hotel.media-manifest.json) ;;
              *) echo "Unexpected path $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(media): self-host Oasis dining and courtyard photography'
          git push origin HEAD:refs/heads/feat/vertical-boutique-hotel
