name: Prepare Forma local licensed assets
on:
  push:
    branches: [chore/forma-local-media]
    paths: ['.github/workflows/prepare-forma-media.yml','scripts/prepare-forma-media.mjs']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/prepare-forma-media.mjs
      - name: Commit only generated photos and manifest
        run: |
          set -euo pipefail
          git add -- public/assets/portfolio/interiors-kitchens/walnut.webp docs/30-verticals/media/interiors-kitchens.media-manifest.json
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Correct Forma walnut wood sample after screenshot review'
          git push origin HEAD:refs/heads/chore/forma-local-media
