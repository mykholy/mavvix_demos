name: Prepare licensed Elyra photography
on:
  workflow_dispatch:
  push:
    branches: [feat/vertical-skin-clinic]
    paths: ['.github/workflows/prepare-elyra-media.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/vertical-skin-clinic'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Download, verify and optimize licensed originals
        run: |
          mkdir -p public/assets/portfolio
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --retry-all-errors --max-time 90 --max-filesize 15000000 --user-agent 'MavvixPortfolio/1.0 (info@mavvix.com; licensed photo mirror)' 'https://upload.wikimedia.org/wikipedia/commons/3/3a/Modern_medical_examination_room.jpg' -o /tmp/elyra-room.jpg
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --retry-all-errors --max-time 90 --max-filesize 15000000 --user-agent 'MavvixPortfolio/1.0 (info@mavvix.com; licensed photo mirror)' 'https://upload.wikimedia.org/wikipedia/commons/0/0a/Dermascope.jpg' -o /tmp/elyra-device.jpg
          echo '1c55782a48b6bcaef3f7d7e144839e4f20d85f63  /tmp/elyra-room.jpg' | sha1sum -c -
          echo '765279e39fe306f89af5fef87f594dbcc0030e4a  /tmp/elyra-device.jpg' | sha1sum -c -
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import crypto from 'node:crypto';
          import sharp from 'sharp';
          const d=JSON.parse(await fs.readFile('data/verticals/skin-clinic.json','utf8'));
          const assets=[];
          for(const [i,name] of ['elyra-room','elyra-device'].entries()){
            const p=d.media[i], original='/tmp/'+name+'.jpg';
            const meta=await sharp(original,{limitInputPixels:50000000}).metadata();
            if(meta.format!=='jpeg'||meta.width!==p.width||meta.height!==p.height)throw Error('Unexpected original: '+name);
            const local='/assets/portfolio/'+name+'.webp', file='public'+local;
            await sharp(original,{limitInputPixels:50000000}).rotate().resize({width:1600,height:1600,fit:'inside',withoutEnlargement:true}).webp({quality:85}).toFile(file);
            const bytes=await fs.readFile(file); const m=await sharp(bytes).metadata(); await sharp(bytes).raw().toBuffer();
            assets.push({id:name,source_page:p.source,author:p.credit,license:p.license,license_url:p.licenseUrl,downloaded_from:p.originalUrl,original_sha1:p.originalSha1,local,dimensions:m.width+'x'+m.height,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),bytes:bytes.length,changes:'Resized, rotated and WebP encoded, display crop; editorial photo, not Elyra premises or equipment. Original license retained.'});
            p.url=local;
          }
          await fs.writeFile('data/verticals/skin-clinic.json',JSON.stringify(d,null,2)+'\n');
          await fs.writeFile('docs/30-verticals/media/skin-clinic.media-manifest.json',JSON.stringify({vertical:'skin-clinic',assets},null,2)+'\n');
          console.log('VERIFIED MEDIA',JSON.stringify(assets));
          NODE
          git add -- public/assets/portfolio/elyra-room.webp public/assets/portfolio/elyra-device.webp data/verticals/skin-clinic.json docs/30-verticals/media/skin-clinic.media-manifest.json
          git diff --cached --binary > /tmp/elyra-media.patch
          test -s /tmp/elyra-media.patch
      - uses: actions/upload-artifact@v4
        with:
          name: elyra-media
          path: |
            /tmp/elyra-media.patch
            public/assets/portfolio/elyra-room.webp
            public/assets/portfolio/elyra-device.webp
            docs/30-verticals/media/skin-clinic.media-manifest.json
  publish:
    needs: prepare
    if: github.ref == 'refs/heads/feat/vertical-skin-clinic'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vertical-skin-clinic
      - uses: actions/download-artifact@v4
        with:
          name: elyra-media
          path: /tmp/elyra-approved
      - name: Publish only verified images on exact head
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          patch="$(find /tmp/elyra-approved -name elyra-media.patch -type f)"
          test -f "$patch"
          git apply --index "$patch"
          git diff --cached --name-only | while IFS= read -r file; do
            case "$file" in
              public/assets/portfolio/elyra-room.webp|public/assets/portfolio/elyra-device.webp|data/verticals/skin-clinic.json|docs/30-verticals/media/skin-clinic.media-manifest.json) ;;
              *) echo "Unexpected path $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(skin-clinic): self-host checksum-verified editorial photography'
          git push origin HEAD:refs/heads/feat/vertical-skin-clinic
