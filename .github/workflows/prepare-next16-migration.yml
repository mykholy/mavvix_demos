name: Prepare isolated Zod 4 security upgrade (generated route type regression)
on:
  push:
    branches: ['fix/mavvix-next16-migration']
    paths: ['.github/workflows/prepare-next16-migration.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upgrade vulnerable Zod to patched major version
        run: npm install --save-exact zod@4.6.7
      - name: Validate dependency and API compatibility
        run: |
          npm ci
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
          npx --no-install next typegen
          npm run typecheck
          npm run db:migrate
          npm run db:seed
          npm run qa:handoff
          npm run test:unit
          npm run build
      - name: Generate reviewable source and lockfile patch
        run: |
          git add -- package.json package-lock.json
          git diff --cached --binary -- package.json package-lock.json > "$RUNNER_TEMP/next16.patch"
          test -s "$RUNNER_TEMP/next16.patch"
          git diff --cached --stat
      - uses: actions/upload-artifact@v4
        with:
          name: next16-candidate
          path: ${{ runner.temp }}/next16.patch
          if-no-files-found: error
          retention-days: 7
  publish-candidate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    if: github.repository == 'mykholy/mavvix_demos' && github.ref == 'refs/heads/fix/mavvix-next16-migration'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: next16-candidate
          path: ${{ runner.temp }}/candidate
      - name: Commit candidate to isolated branch only
        shell: bash
        run: |
          git apply --index "$RUNNER_TEMP/candidate/next16.patch"
          git diff --cached --name-only | while IFS= read -r path; do
            case "$path" in
              package.json|package-lock.json) ;;
              *) echo "Unexpected path: $path"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "fix(security): upgrade Zod to patched 4.6.7"
          git push origin HEAD:refs/heads/fix/mavvix-next16-migration
